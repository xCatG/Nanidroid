name: Android build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and local checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android components
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and check
        run: bash ./gradlew testDebugUnitTest lint assembleDebug assembleDebugAndroidTest assembleRelease
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: app/build/reports/
          if-no-files-found: warn
      - name: Unsigned and debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: app/build/outputs/apk/
          if-no-files-found: error
