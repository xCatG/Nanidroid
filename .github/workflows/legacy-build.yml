name: Legacy and Gradle builds

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/modernization

permissions:
  contents: read

concurrency:
  group: legacy-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test artifact contract and repository hygiene
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_repository_hygiene.py

      - name: Build and validate legacy APK
        run: |
          docker compose -f docker/legacy/compose.yaml build
          docker compose -f docker/legacy/compose.yaml run --rm build

      - name: Build and compare Gradle APK
        run: |
          docker compose -f .devcontainer/compose.yaml build
          docker compose -f .devcontainer/compose.yaml run --rm dev ./docker/gradle/build.sh

      - name: Upload reference and Gradle artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nanidroid-builds-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
